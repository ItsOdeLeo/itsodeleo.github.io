name: Deploy Hexo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Finish each deploy and its notification before computing the next diff.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify SEO and language behavior
        run: npm test

      - name: Prepare changed URLs for IndexNow
        run: node tools/indexnow.js prepare "$RUNNER_TEMP/indexnow"

      - name: Retain IndexNow submission for notification and manual retry
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-submission
          path: ${{ runner.temp }}/indexnow/pending.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify IndexNow after deployment
    runs-on: ubuntu-latest
    needs: deploy
    # IndexNow availability must not turn a successful Pages deploy into a failure.
    # Errors remain visible in this job's log and workflow summary; its artifact
    # can be retried without issuing a new blanket submission.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pending notification
        uses: actions/download-artifact@v4
        with:
          name: indexnow-submission
          path: ${{ runner.temp }}/indexnow

      - name: Verify deployed content and notify participating search engines
        run: node tools/indexnow.js submit "$RUNNER_TEMP/indexnow"
